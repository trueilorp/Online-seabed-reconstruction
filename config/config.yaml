# Config di evaluate.py (e degli script di benchmark/).
# Ogni terreno sintetico viene caricato, pulito (preprocessing) e ricostruito con ciascun metodo;
# la mesh viene confrontata con la ground truth (sezione evaluation).

paths:
  neural_methods: "neural_methods"   # root dei repo neurali clonati (contiene ppsurf/)

preprocessing:
  downsampling:
    abilitato: true                  # false = nessun voxel downsampling (tutti i punti del CSV)
    voxel_size: 0.5                  # lato del voxel in metri
  rimozione_outlier:
    abilitato: true                  # false = nessun filtro statistico degli outlier
    nb_neighbors: 20                 # quanti vicini considerare per punto
    std_ratio: 2.0                   # soglia in deviazioni standard

# Dopo la ricostruzione (con e senza sliding window): via i triangoli il cui baricentro dista piu' di
# distanza_max_punti (m) dal punto piu' vicino della point cloud pulita (con la SW: della finestra).
# Senza, Poisson chiude ogni finestra con una cupola nell'acqua (~6 m sopra il fondale, ~1/3 della mesh).
# Deve restare > evaluation.tau, altrimenti la precisione a tau e' garantita dal ritaglio stesso.
postprocessing:
  distanza_max_punti: 1.0            # null = nessun ritaglio

# Ricostruzione a finestre di ping: il CSV viene letto a blocchi come se arrivasse dal sonar,
# ogni finestra viene ricostruita e scartata, le mesh delle finestre (ritagliate sulla propria
# zona) vengono unite. Attivabile anche da riga di comando: evaluate.py --sliding_window on/off.
sliding_window:
  abilitato: false
  ping_per_finestra: 300             # ping per finestra (sintetici: ~190 punti/ping, 300 ping ~ 50 m di rotta)
  ping_sovrapposizione: 60           # ping in comune tra finestre consecutive (divisi a meta' nel ritaglio)
  righe_per_blocco: 20000            # righe lette dal CSV per volta (simula l'arrivo dei dati)
  punti_campione_per_finestra: 5000  # punti tenuti per finestra (restituiti con la mesh, non usati dalle metriche)

poisson:
  profondita: 9                      # profondita' dell'octree (celle ~0.2 m su 100 m)
  rimuovi_bassa_densita: 0.05        # quantile di vertici a bassa densita' da rimuovere (scelto con benchmark/sweep_densita_poisson.py)
  dimensione_min_componente: 0       # componenti connesse piu' piccole vengono rimosse (con 0.05 sopra non cambia nulla)

ppsurf:
  max_punti: 250000                  # sottocampionamento casuale oltre questa soglia (consigliata dal README di PPSurf)
  gen_resolution_global: 129         # griglia di marching cubes (default 257: OOM su 4 GB; su 12 GB non migliora, vedi README)
  rec_batch_size: 10000              # punti della griglia valutati per volta (default 50000: OOM su 4 GB)
  gen_subsample_manifold_iter: 3     # test-time augmentation: ripetizioni della parte globale su sottoinsiemi dei punti (default PPSurf 10)
  gen_refine_iter: 3                 # raffinamento delle intersezioni di marching cubes (default PPSurf 10)
  # 3/3 invece di 10/10: -36% di tempo (176 -> 112 s per terreno), qualita' invariata o migliore (vedi README)
  conda_env: "pps"                   # ambiente conda di PPSurf
  work_dir: "output/ppsurf_tmp"      # file temporanei scambiati col sottoprocesso
  timeout_s: 1200                    # oltre 20 min (normale: ~3 min) il sottoprocesso viene terminato e il terreno segnato come errore

evaluation:
  synthetic_dir: "data/synthetic"    # <split>/<id>/{<id>_scan.csv, <id>_ground_truth.obj}
  output_dir: "output/evaluation"    # risultati in <output_dir>/<split>/ (mesh, distanze, CSV)
  split: "test+val"                  # train, val, test, test+val (sovrascrivibile con --split)
  limit: null                        # terreni per famiglia (i primi in ordine alfabetico); null = tutti
  metodi: ["poisson", "ppsurf"]      # eseguiti in sequenza su ogni terreno
  n_campioni: 100000                 # punti campionati su ciascuna superficie per le metriche
  tau: 0.5                           # soglia di precisione/richiamo in metri (pari al voxel del preprocessing)