# Config of evaluate.py (and of the scripts in benchmark/).
# Each synthetic terrain is loaded, cleaned (preprocessing) and reconstructed with each method;
# the mesh is compared with the ground truth (evaluation section).

paths:
  neural_methods: "neural_methods"   # root of the cloned neural repositories (contains ppsurf/)

preprocessing:
  downsampling:
    enabled: true                    # false = no voxel downsampling (all points of the CSV)
    voxel_size: 0.5                  # voxel side in metres
  outlier_removal:
    enabled: true                    # false = no statistical outlier filter
    nb_neighbors: 20                 # neighbours considered per point
    std_ratio: 2.0                   # threshold in standard deviations

# After reconstruction (with and without sliding window): drop the triangles whose centroid is farther
# than max_point_distance (m) from the nearest point of the cleaned point cloud (with SW: of the window).
# Without it, Poisson closes each window with a dome in the water (~6 m above the seabed, ~1/3 of the mesh).
# Must stay > evaluation.tau, otherwise precision at tau is guaranteed by the crop itself.
postprocessing:
  max_point_distance: 1.0            # null = no crop

# Reconstruction in windows of pings: the CSV is read in chunks as if it came from the sonar,
# each window is reconstructed and discarded, and the window meshes (cropped to their own
# area) are merged. Can also be set from the command line: evaluate.py --sliding_window on/off.
sliding_window:
  enabled: false
  pings_per_window: 150              # pings per window (synthetic: ~190 points/ping, 150 pings ~ 25 m of track)
  # with 300 pings PPSurf left many holes (flat_sand_012: recall at tau=0.2 0.70 -> 0.98 with 150)
  overlap_pings: 30                  # pings shared by consecutive windows (split in half by the crop)
  rows_per_chunk: 20000              # CSV rows read at a time (simulates data arrival)
  sample_points_per_window: 5000     # points kept per window (returned with the mesh, not used by the metrics)

poisson:
  depth: 9                           # octree depth (cells ~0.2 m over 100 m)
  remove_low_density: 0.05           # quantile of low-density vertices to remove (chosen with benchmark/poisson_density_sweep.py)
  min_component_size: 0              # smaller connected components are removed (with 0.05 above it changes nothing)

ppsurf:
  max_points: 250000                 # random subsampling above this threshold (recommended by the PPSurf README)
  gen_resolution_global: 129         # marching-cubes grid (default 257: OOM on 4 GB; no better on 12 GB, see report)
  rec_batch_size: 10000              # grid points evaluated at a time (default 50000: OOM on 4 GB)
  gen_subsample_manifold_iter: 3     # test-time augmentation: repetitions of the global part on point subsets (PPSurf default 10)
  gen_refine_iter: 3                 # refinement of the marching-cubes intersections (PPSurf default 10)
  # 3/3 instead of 10/10: -36% time (176 -> 112 s per terrain), same or better quality (see report)
  conda_env: "pps"                   # conda environment of PPSurf
  work_dir: "output/ppsurf_tmp"      # temporary files exchanged with the subprocess
  timeout_s: 1200                    # after 20 min (normal: ~3 min) the subprocess is killed and the terrain marked as an error

evaluation:
  synthetic_dir: "data/synthetic"    # <split>/<id>/{<id>_scan.csv, <id>_ground_truth.obj}
  output_dir: "output/evaluation"    # one folder per run (meshes, distances, CSV)
  split: "test+val"                  # train, val, test, test+val (overridable with --split)
  limit: null                        # terrains per family (the first in alphabetical order); null = all
  methods: ["poisson", "ppsurf"]     # run in sequence on each terrain
  n_samples: 100000                  # points sampled on each surface for the metrics
  tau: 0.5                           # precision/recall threshold in metres (equal to the preprocessing voxel)

# Online reconstruction from Unity (online_reconstruction.py): the CSV is read while Unity writes it, the points
# are accumulated in a voxel map (preprocessing.downsampling.voxel_size) and at each update the XZ box covered by
# the new points is rebuilt with Poisson (same outlier removal, normals, Poisson and crop as above) and replaces
# that part of the mesh.
online:
  update_every_pings: 5              # pings between two mesh updates (Unity: ~1 ping/s, ~22k points each)
  margin: 2.5                        # map points around the updated box also given to Poisson, then cropped away, m
  poisson_threads: 4                 # Poisson threads (-1 = all cores: with Unity running 25 s instead of 2 s per update,
                                     # see benchmark/poisson_threads.py; same mesh with any value)
  poll_s: 0.2                        # how often the growing CSV is checked, s
  snapshot_every: 1                  # keep a copy of the mesh every N updates in meshes/ (0 = never), for the GIF
  idle_timeout_s: 15                 # stop after this long without new data (Unity stopped), s
  output_dir: "output/online"        # one folder per run (mesh.ply, updates.csv, config.txt, log.txt)
